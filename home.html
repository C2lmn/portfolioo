<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f4f4f4;
            --border-color: #ddd;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e8e8e8;
            --card-bg: #1e1e1e;
            --border-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }


        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 48px;
            background: var(--bg-darker);
        }

        #theme-toggle {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--divider);
            background-color: var(--bg-dark);
            color: var(--text-light);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .logo {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.3px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
        }

        .nav-links a:hover {
            color: var(--text-light);
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-icon span {
            width: 26px;
            height: 2px;
            background: var(--text-light);
            display: block;
        }

        .hero {
            display: grid;
            grid-template-columns: 40% 60%;
            flex: 1;
        }

        .hero-image {
            position: relative;
            background: url('Carl.jpg');
            background-size: cover;
            background-position: center;
            min-height: 420px;
        }

        .hero-image::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.03) 0px, rgba(255, 255, 255, 0.03) 2px, transparent 2px, transparent 6px);
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 60px;
            position: relative;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 76px;
            line-height: 1.02;
            letter-spacing: -1px;
        }

        .title-rule {
            flex: 1;
            height: 1px;
            background: var(--divider);
            margin-top: 10px;
            display: none;
        }

        .top-line-wrap {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .top-line-wrap .rule {
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        .lede {
            color: var(--text-dim);
            font-size: 14.5px;
            line-height: 1.7;
            max-width: 440px;
            margin-top: 28px;
        }

        .cta-row {
            display: flex;
            align-items: center;
            gap: 36px;
            margin-top: 36px;
        }

        .btn-explore {
            background: var(--text-light);
            color: #1c1c1c;
            border: none;
            padding: 16px 34px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-explore:hover {
            transform: translateY(-2px);
            background: #e4e2de;
        }

        .play-video {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }

        .play-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .play-video:hover .play-icon {
            background: var(--text-light);
            color: #1c1c1c;
        }

        .play-icon svg {
            width: 12px;
            height: 12px;
        }

        .page-footer {
            position: absolute;
            bottom: 22px;
            right: 48px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .hero {
            position: relative;
        }
    </style>
</head>

<body>

    <div class="page">
        <nav>
            <button id="theme-toggle">🌙 Dark Mode</button>
            <div class="logo">Carl Angelo D. Acosta</div>
            <ul class="nav-links">
                <li><a href="index.html ">Home</a></li>
                <li><a href="aboutme.html">About Me</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="projects.html">Projects</a></li>
            </ul>
            <div class="menu-icon"><span></span><span></span></div>
        </nav>

        <section class="hero">
            <div class="hero-image"></div>

            <div class="hero-content">
                <h1>My<br>Portfolio</h1>
                <div class="top-line-wrap">
                    <div class="rule"></div>
                </div>
                <p>
                    Technological Institute of the Philippines
                </p>
            </div>
        </section>
    </div>
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const root = document.documentElement;

        let currentTheme = 'light';

        toggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', currentTheme);
            toggleBtn.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        });
    </script>

</body>

</html>
